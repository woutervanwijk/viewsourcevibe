name: Google Play

on:
  workflow_dispatch:  # Manual only: every run uploads a build to Google Play
    inputs:
      track:
        description: Play track
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

jobs:
  upload-play-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release.keystore"

      - name: Build Android App Bundle
        run: flutter build appbundle --release
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: info.wouter.sourceviewer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/android/app/release.keystore"
