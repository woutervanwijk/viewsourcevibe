name: view_source_vibe
description: Source code viewer & page analyzer app
version: 1.1.4+1140

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core packages
  cupertino_icons: ^2.0.0
  web: ^1.1.1
  

  
  # File handling
  archive: ^4.3.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  
  # HTTP requests for URL loading
  http: ^1.1.1
  
  # State management
  provider: ^6.1.1

  # Settings persistence
  shared_preferences: ^2.5.4

  # UI enhancements
  flutter_svg: ^2.3.0
  
  # Platform-specific file handling
  universal_io: ^2.0.4
  
  # Deep linking for URL schemes
  app_links: ^7.2.1
  
  flutter_inappwebview: ^6.2.0-beta.3

  # File type detection
  mime_type: ^1.0.0

  # HTML Unescape
  html_unescape: ^2.0.0

  # Path manipulation
  path: ^1.8.0
  
  # HTML parsing for DOM tree
  html: ^0.15.7
  
  # Tree view UI
  flutter_fancy_tree_view2: ^1.2.0
  
  # XML parsing for DOM tree
  xml: ^6.5.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  url_launcher: ^6.3.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon.webp

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.webp"
  min_sdk_android: 21
  remove_alpha_ios: true
  # web:
  #   generate: true
  #   image_path: "assets/icon.webp"
  #   background_color: "#FFFFFF"
  #   theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icon.webp"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.webp"
  linux:
    generate: true
    image_path: "assets/icon.webp"
